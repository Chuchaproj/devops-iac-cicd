repos:
  - repo: local
    hooks:
      - id: ruff
        name: Python lint
        entry: .venv/bin/ruff check app tests scripts
        language: system
        pass_filenames: false
      - id: shellcheck
        name: Shell lint
        entry: shellcheck
        language: system
        types: [shell]
      - id: yaml
        name: YAML lint
        entry: yamllint -c .yamllint
        language: system
        types: [yaml]
      - id: terraform
        name: Terraform format
        entry: terraform fmt -check -recursive terraform
        language: system
        pass_filenames: false
      - id: ansible
        name: Ansible lint
        entry: .venv/bin/ansible-lint ansible/site.yml
        language: system
        pass_filenames: false
      - id: dockerfile
        name: Dockerfile lint
        entry: hadolint Dockerfile
        language: system
        pass_filenames: false
      - id: secrets
        name: Gitleaks scan
        entry: gitleaks git --pre-commit --staged --redact
        language: system
        pass_filenames: false
