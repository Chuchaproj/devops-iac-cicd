- name: Require Ubuntu host for package installation
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version == "24.04"
- name: Install Docker and Compose from Ubuntu packages
  become: true
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Start Docker service
  become: true
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
